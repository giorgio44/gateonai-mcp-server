[project]
name = "gateonai-mcp-server"
version = "1.3.1"
description = "MCP server for GateOnAI: search thousands of verified AI tools, build shareable AI workflow boards, analyze tool stacks, compare tools and find GDPR-compliant AI solutions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Only for the hosted gateonai.com deployment (usage stats); every tool works without it.
hosted = ["redis>=5.0"]

[project.urls]
Homepage = "https://www.gateonai.com"
Documentation = "https://www.gateonai.com/mcp"
Repository = "https://github.com/giorgio44/gateonai-mcp-server"
Issues = "https://github.com/giorgio44/gateonai-mcp-server/issues"

[project.scripts]
gateonai-mcp = "gateonai_mcp_server:main_sync"
